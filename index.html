<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem('simulflow.tema');if(t==='claro'||t==='escuro')document.documentElement.setAttribute('data-theme',t==='escuro'?'dark':'light')}catch(e){}</script>
  <title>SimulFlow</title>
  <meta name="description" content="SimulFlow — acompanhamento de OPs e FAs entre PCP, Produção, Projetos/Obras, Almoxarifado e Qualidade.">
  <link rel="icon" type="image/png" href="favicon.png">
  <meta name="theme-color" content="#142238">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
  <script>if('serviceWorker' in navigator&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname)))navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(function(){})</script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/componentes.css">
</head>
<body>
  <div id="raiz"><main class="auth-page"><div class="auth-card"><p>Carregando SimulFlow…</p></div></main></div>
  <noscript>O SimulFlow precisa de JavaScript habilitado.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
